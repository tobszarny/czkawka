# Example GitHub Actions workflow for building and releasing macOS bundles
# Place this file in .github/workflows/macos-release.yml to enable automated builds

name: Build macOS Bundle

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v10.0.0
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-macos:
    name: Build macOS Bundle and DMG
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin  # ARM64 for Apple Silicon
      
      - name: Install dependencies
        run: |
          brew install librsvg
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build and package
        run: |
          ./misc/macos/build_and_package.sh --dmg
      
      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Rename DMG with git tag
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mv target/release/Krokiet-10.0.0-macOS.dmg \
             target/release/Krokiet-${VERSION}-macOS-ARM64.dmg
      
      - name: Calculate checksums
        run: |
          cd target/release
          shasum -a 256 Krokiet-*.dmg > checksums.txt
          cat checksums.txt
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            target/release/Krokiet-*.dmg
            target/release/checksums.txt
          retention-days: 30
      
      # Optional: Create GitHub Release (requires repo permissions)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/Krokiet-*.dmg
            target/release/checksums.txt
          draft: true  # Create as draft for manual review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build universal binary (both ARM64 and x86_64)
  build-macos-universal:
    name: Build Universal macOS Bundle
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      
      - name: Install dependencies
        run: |
          brew install librsvg
      
      - name: Build for ARM64
        run: |
          cargo build --release --target aarch64-apple-darwin -p krokiet
      
      - name: Build for x86_64
        run: |
          cargo build --release --target x86_64-apple-darwin -p krokiet
      
      - name: Create universal binary
        run: |
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/krokiet \
            target/x86_64-apple-darwin/release/krokiet \
            -output target/universal/release/krokiet
      
      - name: Copy universal binary to standard location
        run: |
          mkdir -p target/release
          cp target/universal/release/krokiet target/release/krokiet
      
      - name: Create bundle and DMG
        run: |
          ./misc/macos/create_icon.sh
          ./misc/macos/create_bundle.sh
          ./misc/macos/create_dmg.sh
      
      - name: Rename DMG
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv target/release/Krokiet-10.0.0-macOS.dmg \
             target/release/Krokiet-${VERSION}-macOS-Universal.dmg
      
      - name: Upload universal bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-bundle
          path: target/release/Krokiet-*-Universal.dmg
          retention-days: 30
